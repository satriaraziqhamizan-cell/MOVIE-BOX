<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moviebox - Login Page</title>
  <!-- Menghubungkan file HTML dengan file CSS eksternal -->
  <link rel="stylesheet" href="../css/project.css">
</head>
<body>

  <!-- Container utama latar belakang dan tata letak landing page -->
  <div class="hero-container">
    
    <!-- Header / Navigasi atas -->
    <header>
      <img src="../image/Logo.png" alt="Moviebox Logo" class="site-logo">
      <!-- Tombol untuk memicu munculnya modal login -->
      <button class="btn-login-nav" id="openLogin">LOG IN</button>
    </header>

    <!-- Konten teks utama di tengah halaman -->
    <main class="hero-content">
      <h1>Track films you’ve watched<span>.</span><br>Save those you want to see<span>.</span></h1>
    </main>

  </div>

  <!-- Modal Pop-up Form Login -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-card">
      <!-- Tombol Close (X) -->
      <button class="btn-close" id="closeLogin">&times;</button>
      
      <h2 class="modal-title">LOG IN</h2>
      
      <!-- Form input data -->
      <form>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Masukkan username" required>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Masukkan password" required>
        </div>

        <div class="form-footer">
          <p class="signup-text">
            Don't have an account yet? <a href="#">Create an account.</a>
          </p>
          <button type="submit" class="btn-enter">ENTER</button>
        </div>
      </form>

    </div>
  </div>

  <!-- Menghubungkan file HTML dengan file JavaScript eksternal -->
  <script src="script.js"></script>
</body>
</html>
